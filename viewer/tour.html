<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Exhibit - a 55-second tour</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f5f4ef; --panel:#fff; --ink:#1b1c1f; --muted:#5d6068; --line:#e2e0d8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121316; --panel:#1b1d21; --ink:#ecebe6; --muted:#a7aab1; --line:#2c2f35; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 Inter, system-ui, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 48px; }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .mark { width:30px; height:30px; border-radius:7px; background:#1b1c1f; position:relative; }
  .mark::after { content:""; position:absolute; left:6px; right:6px; top:13px; height:6px; background:#ffd128; border-radius:2px; }
  h1 { font-family:"Source Serif 4", Georgia, serif; font-size:30px; margin:0; line-height:1.2; }
  p { color:var(--muted); margin:6px 0 20px; }
  video { width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:10px; background:#fff; box-shadow:0 8px 28px rgba(20,20,20,.08); }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-top:20px; }
  a.btn { display:inline-block; padding:11px 18px; border-radius:9px; text-decoration:none; font-weight:600; border:1px solid var(--line); color:var(--ink); background:var(--panel); }
  a.btn.primary { background:#ffd128; border-color:#e0b400; color:#1b1c1f; }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Exhibit: every fact points to its page</h1></div>
  <p>A 55-second tour of a source-linked medical chronology and bill check, run on a fictional personal-injury file.</p>
  <video src="tour.mp4" poster="tour.jpg" controls playsinline preload="metadata"></video>
  <div class="row">
    <a class="btn primary" href="./">Open the live demo</a>
    <a class="btn" href="https://github.com/Relax108/exhibit">Code and answer key on GitHub</a>
  </div>
</main>
</body>
</html>
